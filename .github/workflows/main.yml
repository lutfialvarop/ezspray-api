name: Build and Push Docker Image

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utama Anda menggunakan nama tersebut

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil kode dari repositori
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Menyiapkan Docker Buildx (fitur modern Docker untuk build)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login ke Docker Hub menggunakan GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build dan Push image ke Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Ganti 'api-potafull' dengan nama aplikasi/image yang Anda inginkan
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ezspray-api:latest
